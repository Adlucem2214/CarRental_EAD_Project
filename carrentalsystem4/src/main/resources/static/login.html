<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
  <div class="bg-white shadow-md rounded-lg p-8 w-96">
    <h1 class="text-2xl font-bold mb-4 text-center">Welcome back</h1>
    <p class="text-gray-600 text-center mb-6">Please enter your details to sign in</p>
    <form id="loginForm">
      <div class="mb-4">
        <label for="email" class="block text-gray-700 font-medium mb-2">Email</label>
        <input
          type="email"
          id="email"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your email"
          required
        />
      </div>
      <div class="mb-4">
        <label for="password" class="block text-gray-700 font-medium mb-2">Password</label>
        <input
          type="password"
          id="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your password"
          required
        />
      </div>
      <div class="text-right mb-4">
        <a href="#" class="text-sm text-blue-500 hover:underline">Forgot password?</a>
      </div>
      <button
        type="submit"
        class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 rounded-md"
      >
        Log in
      </button>
    </form>
    <p class="text-center mt-4 text-gray-600">
      Don't have an account?
      <a href="#" class="text-blue-500 hover:underline">Sign up</a>
    </p>
    <p id="errorMessage" class="text-red-500 text-center mt-4 hidden"></p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("http://localhost:9090/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ email, password }),
        });

        if (!response.ok) {
          throw new Error("Login failed");
        }

        const data = await response.json();

        // Extract user details and role
        const { user, token } = data;

        // Save user ID to localStorage for booking information
        localStorage.setItem("userId", user.id);

        // Redirect based on user role
        if (user.role === "ADMIN") {
          window.location.href = "addcar.html";
        } else if (user.role === "USER") {
          window.location.href = "home.html";
        }
      } catch (error) {
        const errorMessage = document.getElementById("errorMessage");
        errorMessage.textContent = "Invalid email or password. Please try again.";
        errorMessage.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
