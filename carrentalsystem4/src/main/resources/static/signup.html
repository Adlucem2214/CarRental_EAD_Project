<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">
  <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-2 text-center">Create an account</h2>
    <p class="text-sm text-gray-600 mb-6 text-center">Fill in the details to get started</p>
    <form id="signup-form">
      <div class="mb-4">
        <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required
          class="mt-1 block w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
      </div>
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required
          class="mt-1 block w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
      </div>
      <div class="mb-4">
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" name="password" placeholder="******" required
          class="mt-1 block w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
      </div>
      <div class="mb-4">
        <label for="role" class="block text-sm font-medium text-gray-700">Role</label>
        <select id="role" name="role" required
          class="mt-1 block w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
          <option value="" disabled selected>Select your role</option>
          <option value="USER">User</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>
      <button type="submit"
        class="w-full bg-blue-500 text-white py-2 px-4 rounded-md shadow hover:bg-blue-600 focus:outline-none">
        Register
      </button>
    </form>
    <p class="text-sm text-gray-600 mt-4 text-center">
      Already have an account? <a href="login.html" class="text-blue-500 hover:underline">Log in</a>
    </p>
  </div>
  
 <script>document.getElementById("signup-form").addEventListener("submit", async function (event) {
	  event.preventDefault(); // Prevent form submission

	  const name = document.getElementById("name").value;
	  const email = document.getElementById("email").value;
	  const password = document.getElementById("password").value;
	  const role = document.getElementById("role").value;

	  try {
	    const response = await fetch("http://localhost:9090/auth/register", {
	      method: "POST",
	      headers: {
	        "Content-Type": "application/json",
	      },
	      body: JSON.stringify({ name, email, password, role }),
	    });

	    const result = await response.text(); // Assuming the response is a string

	    if (response.ok) {
	      alert(result); // Optionally show a success message
	      window.location.href = "login.html"; // Redirect to login page
	    } else {
	      alert(`Signup failed: ${result}`);
	    }
	  } catch (error) {
	    console.error("Error during signup:", error);
	    alert("An error occurred. Please try again later.");
	  }
	});
</script>
</body>
</html>
