<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Rental</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <header class="bg-white shadow-md">
    <div class="container mx-auto p-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold">Car Rental</h1>
      <nav>
        <ul class="flex gap-4">
          <li><a href="#" class="text-gray-700 hover:text-blue-500">Home</a></li>
          <li><a href="#" class="text-gray-700 hover:text-blue-500">Cars</a></li>
          <li><a href="#" class="text-gray-700 hover:text-blue-500">About</a></li>
          <li><a href="#" class="text-gray-700 hover:text-blue-500">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container mx-auto p-4">
    <h2 class="text-xl font-bold mb-4">Available Cars</h2>
    <div id="carList" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-3 gap-6">
      <!-- Cars will be dynamically loaded here -->
    </div>
  </main>

  <script>
    const carListElement = document.getElementById('carList');

    async function fetchCars() {
      try {
        const response = await fetch('http://localhost:9090/cars');
        const cars = await response.json();
        displayCars(cars);
      } catch (error) {
        console.error('Error fetching cars:', error);
      }
    }

    function displayCars(cars) {
      carListElement.innerHTML = cars.map(car => `
        <div class="bg-white rounded-lg shadow-md p-4">
          <img src="${car.imagePath || 'https://via.placeholder.com/300'}" alt="${car.make}" class="rounded w-full h-40 object-cover">
          <h3 class="text-lg font-bold mt-2">${car.make} ${car.model}</h3>
          <p class="text-gray-600">${car.year}</p>
          <p class="font-semibold text-lg text-blue-500 mt-1">$${car.pricePerDay}/day</p>
          <p class="mt-1">
            <span class="px-2 py-1 rounded-full text-sm ${car.availabilityStatus === 'Available' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
              ${car.availabilityStatus}
            </span>
          </p>
          <button class="mt-4 w-full bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600" onclick="viewDetails(${car.id})">
            View Details
          </button>
        </div>
      `).join('');
    }

    function viewDetails(carId) {
      window.location.href = `detail.html?id=${carId}`;
    }

    fetchCars();
  </script>

</body>
</html>
